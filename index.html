<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Victor Crest's profile card">
    <title>Frontend Mentor | Profile card component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <main class="page">
        <article class="profile-card" aria-label="Victor Crest profile">
            <div class="card-header" aria-hidden="true"></div>
            <img src="image-victor.jpg" alt="Victor Crest" class="avatar">

            <div class="card-body">
                <section class="user-info" aria-label="Profile details">
                    <h1>Victor Crest <span class="age">26</span></h1>
                    <p class="location">London</p>
                </section>

                <hr class="divider">

                <section class="card-stats" aria-label="Profile statistics">
                    <div class="stat">
                        <h2>80K</h2>
                        <p>Followers</p>
                    </div>
                    <div class="stat">
                        <h2>803K</h2>
                        <p>Likes</p>
                    </div>
                    <div class="stat">
                        <h2>1.4K</h2>
                        <p>Photos</p>
                    </div>
                </section>
            </div>
        </article>
    </main>
</body>
</html>
